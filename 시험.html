<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>메리츠 창문 시험</title>
<style>body{font:14px system-ui;margin:0;padding:10px}iframe{width:100%;height:70vh;border:2px solid #f60}
#로그{font:12px monospace;white-space:pre-wrap;background:#111;color:#0f0;padding:8px;height:20vh;overflow:auto}</style></head><body>
<div id="로그">시험 시작…</div>
<iframe id="틀" src="https://msea.meritzfire.com/mblCusReg.do?orgCd=726051080&usg=12"
        allow="publickey-credentials-get *; clipboard-write"></iframe>
<script>
var L=document.getElementById('로그');
function 적기(s){L.textContent+='\n'+s;}
적기('부모 주소: '+location.href);
적기('쿠키 쓸 수 있나: '+navigator.cookieEnabled);
if(document.hasStorageAccess){
  document.hasStorageAccess().then(function(v){적기('hasStorageAccess: '+v);});
}else{적기('hasStorageAccess 없음');}
document.getElementById('틀').addEventListener('load',function(){
  적기('창문 load 됨');
  try{ 적기('창문 안 주소: '+this.contentWindow.location.href); }
  catch(e){ 적기('창문 안 주소 못 읽음(다른 도메인이라 정상): '+e.name); }
});
</script></body></html>
