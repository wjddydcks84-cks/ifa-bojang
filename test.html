<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>메리츠 창문 시험</title>
<style>body{font:14px system-ui;margin:0;padding:8px}
iframe{width:380px;height:600px;border:2px solid #f60;display:block}
#로그{font:12px monospace;white-space:pre-wrap;background:#111;color:#0f0;padding:8px}</style></head><body>
<div id="로그">시험 시작…</div>
<iframe id="틀" src="https://msea.meritzfire.com/mblCusReg.do?orgCd=726051080&usg=12"></iframe>
<script>
var L=document.getElementById('로그'), 틀=document.getElementById('틀');
function 적기(s){L.textContent+='\n'+s;}
적기('부모: '+location.href);
틀.addEventListener('load',function(){
  적기('load 됨 · 창문높이='+틀.offsetHeight);
  /* 창문 안이 09(끝) 화면이면 history 가 한 번 더 움직인다.
     cross-origin 이라 주소는 못 읽지만 history.length 는 셀 수 있다. */
  try{ 적기('창문 history 길이: '+틀.contentWindow.history.length); }
  catch(e){ 적기('history 못 읽음: '+e.name); }
});
setTimeout(function(){ 적기('10초 뒤 창문높이='+틀.offsetHeight); }, 10000);
</script></body></html>
